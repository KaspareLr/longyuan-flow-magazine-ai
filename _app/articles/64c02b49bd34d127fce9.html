<h1>冰窟救鹅记（外一篇）</h1>
<p class="article-summary">叶尼塞河不是旦夕之间冰封的。先是岸边出现镜子似的薄冰，冰的外缘不齐，有脆性。往往是小河湾的冰面宽，急流处的冰面窄，且布满裂纹。但是每过一个寒夜，冰面就加宽一些。这样不断加宽，加宽，刚结上的薄冰又被急流冲走，再结上薄冰，再被冲走……这时的叶尼塞河发出低沉的咔嚓声，荒凉而忧伤，然后便一切归于寂静。
岸边结的冰一天天地加宽，加厚，流动的河面愈来</p>
