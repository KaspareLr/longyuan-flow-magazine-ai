<h1>巴图鲁的秘密</h1>
<p class="article-summary">1
多少年来，巴图鲁身世的秘密，一直困扰着我，使我念念不忘。现在终于解开了，我如释重负，心里多少有了一丝轻松、一些宽慰。
可随着时间的流逝、岁月的远去，我越来越思念巴图鲁，常常回忆起和它相处的时光，回想起它精心护卫着我、伴随着我，在险峻、苍茫的昆仑山里，跋涉考察艰辛而又快乐的日子……
巴图鲁，是一条猎犬的名字。
巴图鲁， 是哈萨克语， 翻译成汉文， 是“英雄”的意思。
