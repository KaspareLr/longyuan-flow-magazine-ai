<h1>那些眼睛曾经明亮过（外一首）</h1>
<p class="article-summary">那些眼睛曾经明亮过
在寒冬离去之前
精灵们叽叽喳喳
青枝落满发现的翅膀
一只鸟也带来消息
从遥远的大海
从一棵遥远的树上
有个孩子边走边唱
我们坐下来
在精灵和鸟和孩子相遇的地方
日光仿佛很长
我们坐下来
看那个孩子
渐行渐远
直到夜雾笼罩...</p>
