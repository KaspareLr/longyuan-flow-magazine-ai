<h1>莫日格勒河谷的鵟</h1>
<p class="article-summary">第一次见到它的时候是在六月末，通古勒嘎大叔的营地里。
那天清晨，大叔将草原里的马群赶回来，我帮助大叔将马群赶进马圈。
附近一个旅游景区中午要为远方到来的游客表演套马和驯马的节目，向大叔租借马群。这上百匹的马群的宏大背景可以作为旅游景区展示给游客的压轴节目，当然，也可以为大叔带来不菲的收入。
我们把马群赶进马圈之后，天已经大亮，我们拴了马，到大叔的毡包里喝茶。
我们起得早，还没有吃早饭。毡包</p>
