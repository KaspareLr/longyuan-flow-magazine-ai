<h1>星星只在夜里亮吗？</h1>
<p class="article-summary">天空真调皮，
在漆黑的夜空撒下好多钻石，
一闪一闪的，
钻石睁开了眼，
就变成了星星，
可是星星只在夜里亮吗？
在午后斑驳的树影中，
雀跃在嫩绿的梧桐叶上，
为清唱的鸟儿伴舞，
为朴素的街道点缀，
不就是偷溜出来的星星吗？
它们还去哪儿了？...</p>
