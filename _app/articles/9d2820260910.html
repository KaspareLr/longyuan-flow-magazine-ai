<h1>北国草木</h1>
<p class="article-summary">一、白桦树
我的眼，望着她的眼。
我的心，在为她跳动。
她那洁白的树干，是林中的闪电。
每次遇见她，我总能被她的光击中，变成一株雷击木。
我呆立在她面前，如木，如石，心中却涌动着一个感动之海。
对我这个南方女子来说，她是远方，是诗歌，是风雪...</p>
