<h1>我的狼邻居</h1>
<p class="article-summary">一
在我的军旅生涯中，曾有一段独自一人在一片大漠荒原上驻守执勤的难忘经历。
这片大漠荒原上有狼！我曾与狼群整整做了一年的邻居。
我到哨所上岗的那天，是乘坐武装直升机到达目的地的。
