<h1>两个故事</h1>
<p class="article-summary">小猪神神秘秘地把小狐狸拉到一条石板路旁。
“瞧我发现了什么，”小猪指着一块石头，“那块石头上面有好几行字！”
小狐狸似乎兴趣缺缺：“可能是谁刻在那里……”
“不是刻的。”小猪严肃地说，“我摸过，石头表面很光滑很平坦，一点儿凹痕都感觉不出。”
小狐狸凑上前去，用爪子按了按那块石头—小猪说得没错，那些文字就好像从石头上长出来的一样。他漫不经心</p>
