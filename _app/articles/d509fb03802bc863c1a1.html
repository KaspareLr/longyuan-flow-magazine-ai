<h1>犊</h1>
<p class="article-summary">1
我在悲伤的呼唤声中醒来。
这是足以击倒一切的如同潮水般涌来的悲伤。
这呼唤声让我不得不将自己从刚刚过去的这个春日夜晚香甜的梦境里抽离出来。我试图描述这种悲伤的呼唤，像是穿越阴沉海面的雾号，带着北欧峡湾般深沉的意味，悠远，沉重。
悲伤，太多的悲伤。
这是个晴朗的暮春清晨。
雪已经完全融化，渗入大地，随着几天的狂风，草原告别了让人崩溃的泥泞，干爽清凉。绿草刚刚探头，草原上已经有若隐若现</p>
