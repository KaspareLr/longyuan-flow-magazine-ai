<h1>嘘——红狐学校在考试</h1>
<p class="article-summary">这天，红狐谷路口大青石的屁股上，贴出了一张红纸，上面是一个黑色的大字：嘘—
这是要考试了吗？这当然是要考试了！
是红狐校长亲自写的这个字。
对了，这条山谷里有一所红狐学校。
红狐学校！哼！就因为校长是红狐小姐，这个学校就得叫红狐学校吗？唵，这个学校里的学生全是红狐吗？有一次，猫头鹰爷爷背着手站在校门口大发脾气。他是看着这个校名不高兴的！
</p>
