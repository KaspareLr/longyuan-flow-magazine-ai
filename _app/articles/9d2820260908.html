<h1>可爱的事（外一首）</h1>
<p class="article-summary">和一只幼小的螳螂对视，
谁先忍不住眨眼呢？
伸出食指拦住赶路的蜗牛，
谁先礼貌地后退三步呢？
在布谷鸟女士啼唱的间隙，
放进自己快乐的鸣声，
谁先说出赞美的词句呢？
伸出双臂紧紧环住枫杨的身躯，
谁先笑出声，或者大声说：
今天实在太开心了！...</p>
